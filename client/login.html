<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TutorLink Bangladesh</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav-luxury">
        <div class="nav-container">
            <div class="logo-luxury">
                <i class="fas fa-feather-alt"></i>
                <span>TutorLink <span class="gold">Bangladesh</span></span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#tutors">Find Tutors</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
            <div class="nav-auth" id="authButtons">
                <!-- Handled by auth.js -->
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="register-section"> <!-- Reusing register-section class for consistent padding -->
        <div class="register-container">
            <div class="register-header">
                <div class="register-icon">🔑</div>
                <h2>Welcome Back</h2>
                <p>Sign in to your TutorLink account</p>
            </div>

            <!-- The form ID is important for auth.js to reset it -->
            <form id="loginForm" onsubmit="event.preventDefault(); login()">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email Address</label>
                    <!-- ID must be loginEmail to match auth.js -->
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <!-- ID must be loginPassword to match auth.js -->
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-register-submit" style="margin-top: 1rem;">
                    Sign In
                </button>
            </form>

            <div class="register-footer">
                <p>Don't have an account? <a href="register.html">Create one here</a></p>
            </div>
        </div>
    </section>

    <!-- Toast for notifications -->
    <div id="toast" class="toast"></div>

    <!-- Load scripts -->
    <script src="js/auth.js"></script>
</body>
</html>
